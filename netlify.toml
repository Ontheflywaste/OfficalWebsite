[build]
command = "npx vite build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/favicon.ico"
to = "/Images/Favicon1.png"
status = 200

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap.xml"
status = 200

[[redirects]]
from = "/video-sitemap.xml"
to = "/video-sitemap.xml"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/favicon.ico"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "image/png"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/xml"

[[headers]]
for = "/video-sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/xml"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "text/javascript"

[[headers]]
for = "/*.css"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "text/css"

[[headers]]
for = "/Images/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Vary = "Accept"

[[headers]]
for = "/logos/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/videos/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "video/mp4"