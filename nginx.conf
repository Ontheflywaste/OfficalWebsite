# NGINX Configuration for On The Fly Waste Solutions
# If you are using NGINX as your web server, add these rules to your server block

# NOTE: This file is for NGINX servers only. If you're using Apache, use the .htaccess file instead.
# Place these rules inside your server {} block in your NGINX configuration.

# Remove trailing slashes (except for root)
rewrite ^/(.*)/$ /$1 permanent;

# Remove query strings from all URLs
if ($args) {
  rewrite ^(.*)$ $1? permanent;
}

# Handle React Router / SPA routing
location / {
  try_files $uri $uri/ /index.html;
}

# Cache static assets
location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json|wasm)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
gzip_disable "msie6";
