    <!-- Critical CSS for hero section to prevent layout shift -->
    <style>
      /* Critical hero styles to prevent CLS */
      .hero-container {
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0.45));
        z-index: 10;
      }
      
      .hero-content {
        position: relative;
        z-index: 20;
        text-align: center;
        color: white;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1.5rem;
        padding-top: 20vh; /* Lowered text positioning */
      }
      
      .hero-title {
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 1.25rem;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        letter-spacing: -0.025em;
        text-align: center;
      }
      
      .hero-subtitle {
        font-weight: 400;
        line-height: 1.5;
        margin-bottom: 2rem;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
        opacity: 0.95;
        max-width: 48rem;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
      }
      
      /* Mobile-first responsive text sizing */
      .hero-title { 
        font-size: 1.5rem; /* 24px */
      }
      .hero-subtitle { 
        font-size: 1.125rem; /* 18px */
      }
      
      /* Small mobile (375px+) */
      @media (min-width: 375px) {
        .hero-title { font-size: 1.75rem; } /* 28px */
        .hero-subtitle { font-size: 1.125rem; } /* 18px */
      }
      
      /* Large mobile (480px+) */
      @media (min-width: 480px) {
        .hero-title { font-size: 2rem; } /* 32px */
        .hero-subtitle { font-size: 1.25rem; } /* 20px */
      }
      
      /* Tablet (640px+) */
      @media (min-width: 640px) {
        .hero-title { font-size: 2.5rem; } /* 40px */
        .hero-subtitle { font-size: 1.375rem; } /* 22px */
      }
      
      /* Large tablet (768px+) */
      @media (min-width: 768px) {
        .hero-title { font-size: 3rem; } /* 48px */
        .hero-subtitle { font-size: 1.5rem; } /* 24px */
      }
      
      /* Desktop (1024px+) */
      @media (min-width: 1024px) {
        .hero-title { font-size: 3.5rem; } /* 56px */
        .hero-subtitle { font-size: 1.625rem; } /* 26px */
      }
      
      /* Large desktop (1280px+) */
      @media (min-width: 1280px) {
        .hero-title { font-size: 4rem; } /* 64px */
        .hero-subtitle { font-size: 1.75rem; } /* 28px */
      }
      
      /* Extra large desktop (1536px+) */
      @media (min-width: 1536px) {
        .hero-title { font-size: 4.5rem; } /* 72px */
        .hero-subtitle { font-size: 1.875rem; } /* 30px */
      }
    </style>

    <!-- Deferred Analytics -->
    <script>
      // Defer analytics until after page load
      window.addEventListener('load', function() {
        // Load analytics only after user interaction
        var analyticsLoaded = false;
        function loadAnalytics() {
          if (!analyticsLoaded) {
            analyticsLoaded = true;
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17079694713';
            document.head.appendChild(script);
            
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'AW-17079694713');
          }
        }
        
        // Load analytics on first user interaction
        ['scroll', 'click', 'touchstart', 'keydown'].forEach(function(event) {
          document.addEventListener(event, loadAnalytics, { once: true, passive: true });
        });
        
        // Fallback: load after 3 seconds if no interaction
        setTimeout(loadAnalytics, 3000);
      });
    </script>
    
    <!-- Prefetch non-critical routes after load -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var routes = ['/blog', '/contact', '/reviews'];
          routes.forEach(function(route) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = route;
            link.as = 'document';
            document.head.appendChild(link);
          });
        }, 2000);
      });
    </script>
